server {
  listen 80;

  # Security headers. The JWT lives in localStorage, so XSS/clickjacking
  # mitigation matters. `always` so they apply to error/redirect responses too;
  # TLS is terminated by the proxy (Coolify/Cloudflare), hence HSTS here.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # A Content-Security-Policy is strong extra hardening, but its connect-src must
  # list your API origin (VITE_API_URL). Uncomment and set it per deployment:
  # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://your-api-host; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
